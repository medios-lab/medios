<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design: separate GPU assignment from GPU device isolation (medios#45)</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #F4F6F9; --card: #FFFFFF; --line: #DDE3EC; --fg: #1F2933; --muted: #5A6577;
    --blue: #184E88; --teal: #137A63; --red: #B83333; --amber: #B45309;
    --teal-bg: #E3F2EE; --red-bg: #F8E6E6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 1.55rem; margin: 0 0 4px; color: var(--blue); }
  h2 { font-size: 1.12rem; margin: 34px 0 8px; color: var(--blue); }
  h3 { font-size: 1rem; margin: 18px 0 6px; }
  p { margin: 6px 0 12px; }
  ol { margin: 6px 0 12px; padding-left: 22px; }
  ol li { margin-bottom: 8px; }
  code { font: 0.87em ui-monospace, SFMono-Regular, Menlo, monospace; background: #EEF1F5; padding: 1px 4px; border-radius: 3px; }
  pre { font: 0.84em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #EEF1F5; padding: 10px 12px;
    border-radius: 6px; overflow-x: auto; margin: 6px 0 12px; }
  pre.mermaid { background: var(--card); border: 1px solid var(--line); }
  .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .wide { max-width: 1140px; margin: 0 auto; padding: 0 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
  .wrap { overflow-x: auto; margin: 6px 0 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; font-size: 0.87rem; }
  th { background: #EEF1F5; font-weight: 600; }
  tr.proposed td { background: #F6FAF8; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 12px; }
  label.ctl { display: block; font-size: 0.84rem; color: var(--muted); }
  select, input[type=range] { width: 100%; margin-top: 4px; font: inherit; }
  select { padding: 5px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; margin-top: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0; }
  @media (max-width: 820px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .kpi { border-radius: 6px; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); }
  .kpi b { display: block; font-size: 1.3rem; }
  .kpi span { font-size: 0.8rem; color: var(--muted); }
  .kpi.bad b { color: var(--red); } .kpi.good b { color: var(--teal); } .kpi.warn b { color: var(--amber); }
  .result { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 0.87rem; background: #fff; }
  .result ul { margin: 6px 0 0 18px; padding: 0; }
  .src { color: var(--muted); font-size: 0.85rem; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// Behaviour model for appendix A: one medios node with two GPUs, tasks that
// each request gpus:1. Each rule cites a row of appendix B.

const NODES = {
  unpriv: "medios node inside a RunPod pod (cannot create cgroups)",
  priv: "medios node on a Linux host with cgroups/devices",
};

const CONFIGS = {
  none: "Current: no GPU isolator",
  module: "Current: com_medioslab_medios_gpu",
  assign: "Proposed: gpu/assign",
  both: "Proposed: gpu/assign,gpu/devices",
  devicesOnly: "Proposed, misconfigured: gpu/devices alone",
};

const DEVICE_REFUSAL = "launch refused by the medios containerizer: device declarations without cgroups/devices (containerizer.cpp:282-299)";
const NO_PLACEMENT = "launch refused by gpu/devices prepare(): no assignment recorded for this container (proposed)";

function mechanism(node, config) {
  const none = { label: "No GPU isolator: CUDA uses device 0 unless the task's command sets CUDA_VISIBLE_DEVICES", places: false, env: false, enforces: false, persists: false, advertised: null };
  const module = { label: "com_medioslab_medios_gpu: assignment by UUID and device cgroup; no CUDA_VISIBLE_DEVICES", places: true, env: false, enforces: true, persists: true, advertised: null };
  const assign = { label: "gpu/assign: assignment by UUID and CUDA_VISIBLE_DEVICES; no device cgroup", places: true, env: true, enforces: false, persists: true, advertised: "gpu_isolation:assign" };
  const both = { label: "gpu/assign + gpu/devices: assignment, CUDA_VISIBLE_DEVICES and device cgroup", places: true, env: true, enforces: true, persists: true, advertised: "gpu_isolation:assign,devices" };
  const refused = (reason) => ({ label: "Launch refused", refused: reason, places: false, env: false, enforces: false, persists: false, advertised: null });
  if (config === "none") return none;
  if (config === "module") return node === "unpriv" ? refused(DEVICE_REFUSAL) : module;
  if (config === "assign") return assign;
  if (config === "both") return node === "unpriv" ? refused(DEVICE_REFUSAL) : both;
  return refused(NO_PLACEMENT);
}

const TASKS = [
  { framework: "framework A", ownIndex: 0 },
  { framework: "framework B", ownIndex: null },
  { framework: "framework A", ownIndex: 1 },
];

function simulate(node, config, count, restart, ownEnv) {
  const m = mechanism(node, config);
  let free = [0, 1];
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = TASKS[i];
    const r = { i, framework: t.framework, state: "running", device: null, openable: [], note: "" };
    if (i >= 2) { r.state = "not launched"; r.note = "the controller has no unallocated gpus on this node to offer"; out.push(r); continue; }
    if (m.refused) { r.state = "refused"; r.note = m.refused; out.push(r); continue; }
    if (restart && i === 1 && !m.persists) free = [0, 1];
    const own = ownEnv && t.ownIndex !== null ? t.ownIndex : null;
    if (!m.places) {
      r.device = own !== null ? own : 0;
      r.openable = [0, 1];
      r.note = own !== null ? "its command sets CUDA_VISIBLE_DEVICES=" + own : "no CUDA_VISIBLE_DEVICES, so CUDA uses device 0";
    } else {
      const placed = free.shift();
      if (own !== null && !m.enforces) {
        r.device = own;
        r.note = "assigned GPU " + placed + ", but its command's CUDA_VISIBLE_DEVICES=" + own + " overrides the isolator's value";
      } else {
        r.device = placed;
        r.note = m.env ? "assigned GPU " + placed + ", named in CUDA_VISIBLE_DEVICES" : "assigned GPU " + placed + "; the device cgroup allows only that device";
        if (own !== null && own !== placed) r.note += "; its command's CUDA_VISIBLE_DEVICES=" + own + " names a denied device, so CUDA finds none";
      }
      r.openable = m.enforces ? [r.device] : [0, 1];
    }
    out.push(r);
  }
  const holders = {};
  out.forEach(r => { if (r.state === "running") holders[r.device] = (holders[r.device] || 0) + 1; });
  out.forEach(r => { r.shared = r.state === "running" && holders[r.device] > 1; });
  return { m, tasks: out };
}

function Diagram({ sim, restart }) {
  const W = 560, H = 250, tx = 20, tw = 200, gx = 380, gw = 150;
  const ty = i => 30 + i * 70, gy = d => 55 + d * 100;
  const colour = r => r.state !== "running" ? (r.state === "refused" ? "#B83333" : "#5A6577") : r.shared ? "#B83333" : "#137A63";
  const holders = d => sim.tasks.filter(r => r.state === "running" && r.device === d).length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Tasks and the GPUs they use">
      {sim.tasks.map(r => (
        <g key={"t" + r.i}>
          <rect x={tx} y={ty(r.i)} width={tw} height="48" rx="6" fill="#fff" stroke={colour(r)}
            strokeWidth="1.5" strokeDasharray={r.state === "not launched" ? "5 4" : "0"} />
          <text x={tx + 10} y={ty(r.i) + 20} fontSize="12.5" fontWeight="600" fill="#1F2933">Task {r.i + 1} ({r.framework})</text>
          <text x={tx + 10} y={ty(r.i) + 37} fontSize="11" fill={colour(r)}>
            {r.state === "running" ? (r.shared ? "shares a GPU" : "sole user of its GPU") : r.state}
            {restart && r.i >= 1 && r.state !== "not launched" ? " (after medios-node restart)" : ""}</text>
        </g>
      ))}
      {[0, 1].map(d => (
        <g key={"g" + d}>
          <rect x={gx} y={gy(d)} width={gw} height="50" rx="6" fill={holders(d) > 1 ? "#F8E6E6" : "#E3F2EE"}
            stroke={holders(d) > 1 ? "#B83333" : "#137A63"} strokeWidth="1.5" />
          <text x={gx + 12} y={gy(d) + 22} fontSize="12.5" fontWeight="600" fill="#1F2933">GPU {d}</text>
          <text x={gx + 12} y={gy(d) + 39} fontSize="11" fill="#5A6577">{holders(d)} task(s) using it</text>
        </g>
      ))}
      {sim.tasks.filter(r => r.state === "running").map(r => (
        <g key={"l" + r.i}>
          {r.openable.filter(d => d !== r.device).map(d => (
            <line key={d} x1={tx + tw} y1={ty(r.i) + 24} x2={gx} y2={gy(d) + 25} stroke="#B45309" strokeWidth="1.2" strokeDasharray="4 4" />
          ))}
          <line x1={tx + tw} y1={ty(r.i) + 24} x2={gx} y2={gy(r.device) + 25} stroke={r.shared ? "#B83333" : "#137A63"} strokeWidth="2.4" />
        </g>
      ))}
      <g transform={`translate(20, ${H - 14})`}>
        <line x1="0" y1="-4" x2="22" y2="-4" stroke="#137A63" strokeWidth="2.4" />
        <text x="28" y="0" fontSize="11" fill="#5A6577">device in use</text>
        <line x1="120" y1="-4" x2="142" y2="-4" stroke="#B45309" strokeWidth="1.2" strokeDasharray="4 4" />
        <text x="148" y="0" fontSize="11" fill="#5A6577">device the task can open but was not assigned</text>
      </g>
    </svg>
  );
}

function BehaviourModel() {
  const [node, setNode] = useState("unpriv");
  const [config, setConfig] = useState("none");
  const [count, setCount] = useState(2);
  const [restart, setRestart] = useState(false);
  const [ownEnv, setOwnEnv] = useState(false);
  const sim = simulate(node, config, count, restart, ownEnv);
  const running = sim.tasks.filter(r => r.state === "running");
  const shared = running.filter(r => r.shared).length;
  const exposed = running.filter(r => r.openable.length > 1).length;
  const refused = sim.tasks.filter(r => r.state === "refused").length;
  return (
    <div className="card">
      <div className="controls">
        <label className="ctl">medios node
          <select value={node} onChange={e => setNode(e.target.value)}>
            {Object.entries(NODES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </label>
        <label className="ctl">GPU isolators in --isolation
          <select value={config} onChange={e => setConfig(e.target.value)}>
            {Object.entries(CONFIGS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </label>
        <label className="ctl">Tasks launched, each with gpus:1: {count}
          <input type="range" min="1" max="3" step="1" value={count} onChange={e => setCount(+e.target.value)} />
        </label>
        <div>
          <label className="check"><input type="checkbox" checked={restart} onChange={e => setRestart(e.target.checked)} />
            medios-node restarts between tasks 1 and 2; task 1 keeps running</label>
          <label className="check"><input type="checkbox" checked={ownEnv} onChange={e => setOwnEnv(e.target.checked)} />
            Framework A sets CUDA_VISIBLE_DEVICES in its commands</label>
        </div>
      </div>
      <div className="kpis">
        <div className={"kpi " + (shared ? "bad" : "good")}><b>{shared}</b><span>running tasks sharing a GPU</span></div>
        <div className={"kpi " + (exposed ? "warn" : "good")}><b>{exposed}</b><span>running tasks that can open an unassigned GPU</span></div>
        <div className={"kpi " + (refused ? "bad" : "good")}><b>{refused}</b><span>launches refused</span></div>
        <div className={"kpi " + (sim.m.advertised ? "good" : "warn")}><b>{sim.m.advertised ? "yes" : "no"}</b><span>gpu_isolation attribute in the offer</span></div>
      </div>
      <div className="grid-2">
        <div><Diagram sim={sim} restart={restart} /></div>
        <div className="result">
          <b>{sim.m.label}</b>
          <ul>
            {sim.tasks.map(r => <li key={r.i}>Task {r.i + 1} ({r.framework}): {r.state === "running" ? "uses GPU " + r.device + "; " + r.note : r.note}</li>)}
          </ul>
          <p style={{marginBottom: 0}}>Offer attribute: {sim.m.advertised ? <code>{sim.m.advertised}</code> : "none"}</p>
        </div>
      </div>
    </div>
  );
}

const FAILURE_SEQUENCE = `sequenceDiagram
    participant F as Framework
    participant C as medios controller
    participant N as medios-node (medios containerizer)
    participant I as Isolators in --isolation
    participant E as Command executor
    participant T as Task process (CUDA)
    F->>C: launch task, resources gpus:1
    C->>N: run task on this node
    N->>I: prepare(container)
    I-->>N: no GPU environment, no device declarations
    N->>E: start executor, environment without CUDA_VISIBLE_DEVICES
    E->>T: exec task command
    T->>T: cuInit enumerates all GPUs, uses device 0
    Note over F,T: Derived from the code path and CUDA defaults, not run.`;

function App() {
  useEffect(() => {
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    mermaid.run({ querySelector: "pre.mermaid" });
  }, []);
  return (
    <div>
      <div className="page">
        <h1>Separate GPU assignment from GPU device isolation in the medios GPU module</h1>
        <div className="meta">Design proposal for medios#45 · Status: proposed · Component: <code>src/modules/gpu</code> · Code references are to medios-lab/medios master and are listed in appendix B</div>

        <h2>Tasks on a medios node inside a RunPod pod use GPU 0 unless their commands set CUDA_VISIBLE_DEVICES</h2>
        <p>On 2026-11-26 a medios node running inside a RunPod pod with two A100 GPUs advertised <code>gpus:2</code>. The medios controller recorded both GPUs as allocated to tabular-bench tasks. Those tasks ran on separate GPUs because tabular-bench's commands set <code>CUDA_VISIBLE_DEVICES=0</code> and <code>CUDA_VISIBLE_DEVICES=1</code>.</p>
        <p>The medios node used the medios containerizer, and its <code>--isolation</code> flag listed no GPU isolator. The path a task from any other framework takes on that node:</p>
        <pre className="mermaid">{FAILURE_SEQUENCE}</pre>
        <p>A second framework's <code>gpus:1</code> task would have run on GPU 0 while a tabular-bench task was using it.</p>

        <h2>The medios containerizer refuses the GPU module's device declarations without cgroups/devices, which a RunPod pod cannot provide</h2>
        <p>The GPU module, <code>libmedios_gpu.so</code>, registers one isolator, <code>com_medioslab_medios_gpu</code>, implemented by the class <code>GpuIsolator</code> in <code>src/modules/gpu/gpu_isolator.cpp</code>. Its <code>prepare()</code> assigns devices to each container by NVML UUID and writes the assignment to a checkpoint in the container's directory. Then it calls <code>declare()</code>, which returns device declarations for the <code>/dev/nvidia*</code> files the container may open. The medios containerizer enforces those declarations through the cgroup devices controller. When an isolator returns declarations and <code>--isolation</code> lists neither <code>cgroups/devices</code> nor <code>cgroups/all</code>, the containerizer refuses the launch (<code>containerizer.cpp:282-299</code>).</p>
        <p>A RunPod pod cannot provide <code>cgroups/devices</code>. On 2026-11-27 we inspected a Secure Cloud pod with one A40 GPU in EU-SE-1. It runs cgroup v1, and the devices hierarchy is mounted read-write. But container root is mapped into a user namespace (<code>uid_map 0 165536 65536</code>) and has no <code>CAP_SYS_ADMIN</code>, so creating a child devices cgroup fails with <code>Permission denied</code>. The commands and their output are in <code>cgroup-probe-2026-11-27.md</code> beside this page.</p>

        <h2>Proposal: split GpuIsolator into an assignment isolator and a device isolator in libmedios_gpu.so</h2>
        <p>The change is to <code>GpuIsolator</code> and to the symbols <code>libmedios_gpu.so</code> registers.</p>
        <ul>
          <li><code>GpuIsolator</code> keeps <code>prepare()</code> up to the checkpoint write (<code>gpu_isolator.cpp:214-300</code>), plus <code>recover()</code>, <code>update()</code> and <code>cleanup()</code>. It stops calling <code>declare()</code>. Its <code>prepare()</code> also sets <code>CUDA_VISIBLE_DEVICES</code> to the assigned devices, which the module does not do today. For a command task it writes the variable to the task environment; for any other container it writes the container environment. That is the same split <code>injectVolume()</code> already makes for library paths (<code>:609-614</code>). For a container with its own rootfs, it also bind-mounts the assigned devices' files, <code>/dev/nvidiactl</code> and the unified-memory devices into the rootfs, and calls <code>injectVolume()</code> (<code>:562</code>), which moves into this class. The rootfs has a private <code>/dev</code> with no GPU device files, so without these mounts CUDA in an image container on a node listing <code>gpu/assign</code> alone could not open its assigned GPU.</li>
          <li>A new class, <code>GpuDevicesIsolator</code>, takes over the device declarations in <code>declare()</code> (<code>:489</code>), which the containerizer grants through <code>cgroups/devices</code>. It mounts nothing. Its <code>prepare()</code> reads the container's assignment and fails if none is recorded.</li>
          <li>The ledger stays in <code>GpuIsolator</code>. <code>GpuDevicesIsolator</code> reads the assignment from the allocation checkpoint that <code>GpuIsolator</code> writes under the container's directory before its <code>prepare()</code> returns (<code>checkpoint.hpp</code>, medios#471). The two classes share no memory, and <code>GpuDevicesIsolator</code> keeps no state between calls.</li>
          <li>The library registers two symbols in place of <code>com_medioslab_medios_gpu</code>: <code>com_medioslab_medios_gpu_assign</code> for <code>GpuIsolator</code> and <code>com_medioslab_medios_gpu_devices</code> for <code>GpuDevicesIsolator</code>. The rest of this page writes them as <code>gpu/assign</code> and <code>gpu/devices</code>.</li>
        </ul>
        <p>The medios containerizer creates module isolators in <code>--isolation</code> order (<code>containerizer.cpp:482-516</code>) and runs their <code>prepare()</code> calls one after another (<code>:1539</code>). Listing <code>gpu/assign</code> before <code>gpu/devices</code> therefore guarantees that the assignment exists when <code>gpu/devices</code> reads it.</p>
        <div className="wrap">
          <table>
            <thead><tr><th>Isolator hook</th><th>gpu/assign (<code>GpuIsolator</code>)</th><th>gpu/devices (<code>GpuDevicesIsolator</code>)</th></tr></thead>
            <tbody>
              <tr><td><code>prepare()</code></td><td>Assign devices, write checkpoint, return <code>CUDA_VISIBLE_DEVICES</code></td><td>Read assignment; return declarations, device mounts, driver volume; fail if no assignment</td></tr>
              <tr><td><code>recover()</code></td><td>Rebuild ledger from checkpoints</td><td>None; reads the checkpoint at each <code>prepare()</code></td></tr>
              <tr><td><code>update()</code></td><td>Unchanged: growth beyond assigned devices refused</td><td>Unchanged: access not revoked on shrink</td></tr>
              <tr><td><code>cleanup()</code></td><td>Release assignment, remove checkpoint</td><td>None</td></tr>
              <tr><td>Fails when</td><td>Units file missing or invalid, or NVML unavailable (unchanged, <code>:663-724</code>)</td><td><code>cgroups/devices</code> absent (containerizer check), or no assignment from <code>gpu/assign</code></td></tr>
            </tbody>
          </table>
        </div>

        <h2>Operators select device enforcement by listing GPU isolators in --isolation</h2>
        <p>When configuring a medios node, the operator lists the GPU isolators in the node's <code>--isolation</code> flag. Listing <code>gpu/assign</code> alone makes the node assign devices and set <code>CUDA_VISIBLE_DEVICES</code> without restricting device access. Listing <code>gpu/assign,gpu/devices</code> also restricts each container to its assigned devices, and requires <code>cgroups/devices</code> or <code>cgroups/all</code> in the same flag.</p>
        <pre>{`# medios node inside a RunPod pod
--isolation=posix/cpu,posix/mem,com_medioslab_medios_gpu_assign

# medios node on a Linux host with cgroups/devices
--isolation=cgroups/all,com_medioslab_medios_gpu_assign,com_medioslab_medios_gpu_devices`}</pre>
        <p>The operator also sets an offer attribute naming the GPU isolation the node provides, for example <code>--attributes=gpu_isolation:assign</code> or <code>gpu_isolation:assign,devices</code>, so a framework that needs enforced isolation can filter on it before launching. medios-node does not derive the attribute; node attributes come only from <code>--attributes</code>, so this needs no core change.</p>

        <h2>GPU paths compared</h2>
        <div className="wrap">
          <table>
            <thead><tr><th>GPU path</th><th>Device assignment</th><th><code>CUDA_VISIBLE_DEVICES</code></th><th>Task can use an unassigned GPU</th><th>Assignment after medios-node restart</th><th>Host requirement</th><th>Image container (own rootfs)</th><th>Shares of one GPU</th><th>Offer attribute</th></tr></thead>
            <tbody>
              <tr><td>docker_shell containerizer</td><td>NVML indices, lowest free first, whole GPUs</td><td>Set through <code>docker run --gpus device=…</code></td><td>No: Docker device rules</td><td>Lost: <code>recover()</code> is a no-op (#149)</td><td>Docker daemon; none in a RunPod pod</td><td>Docker image is the container</td><td>No</td><td>None</td></tr>
              <tr><td>medios containerizer, no GPU isolator</td><td>None</td><td>Not set</td><td>Yes: every GPU</td><td>Nothing recorded</td><td>None</td><td>No GPU device files in its <code>/dev</code></td><td>Uncontrolled</td><td>None</td></tr>
              <tr><td>medios containerizer, <code>com_medioslab_medios_gpu</code></td><td>NVML UUIDs from the units file</td><td>Not set</td><td>No: devices cgroup</td><td>Restored from per-container checkpoint</td><td><code>cgroups/devices</code>; not available in a RunPod pod</td><td>Assigned device files and driver libraries bound in</td><td>Only for a resource declared over one GPU (<code>units.cpp:325-345</code>)</td><td>None</td></tr>
              <tr className="proposed"><td>Proposed: <code>gpu/assign</code></td><td>NVML UUIDs from the units file</td><td>Set to the assigned devices</td><td>Yes: by overriding <code>CUDA_VISIBLE_DEVICES</code> in its command (<code>executor.cpp:738-768</code>) or opening <code>/dev/nvidia*</code></td><td>Restored from per-container checkpoint</td><td>NVML and a units file</td><td>Assigned device files and driver libraries bound in by <code>gpu/assign</code></td><td>Allowed by the units file, with no memory or compute limit; the default units file for these nodes declares whole GPUs</td><td><code>gpu_isolation:assign</code></td></tr>

            </tbody>

        </div>

        <h2>Alternatives</h2>
        <h3>A mode parameter on com_medioslab_medios_gpu gives the same runtime behaviour</h3>
        <p>The module could take a parameter in its <code>modules.json</code> entry, such as <code>enforce=false</code>, that skips the device declarations in <code>declare()</code> but keeps the rootfs mounts and <code>injectVolume()</code>. At runtime that behaves the same as the split, and it could expose an offer attribute too. The evidence does not rule it out.</p>
        <p>The split is preferred because, with a parameter, whether a node enforces device access depends on both the module parameter and <code>--isolation</code>, and the two have to agree. With the split, <code>--isolation</code> alone states it, and the existing containerizer check refuses <code>gpu/devices</code> without <code>cgroups/devices</code>.</p>
        <p>The split costs two things. <code>gpu/devices</code> depends on its position after <code>gpu/assign</code> in <code>--isolation</code>, and it reads the checkpoint once per GPU container launch. No module in <code>src/modules</code> registers two isolators today, so this would be the first.</p>
        <h3>A new in-tree assignment isolator adds a third ledger</h3>
        <p>An isolator in <code>src/node/containerizer/medios/isolators</code> could assign devices without changing the module. It would be a third ledger, alongside docker_shell's and the module's, and a medios node running both it and the module would assign every allocation twice. Rejected.</p>
        <h3>A RunPod-specific containerizer duplicates the medios containerizer</h3>
        <p>A containerizer for RunPod pods would need its own launch, sandbox, logging and recovery, which the medios containerizer already provides, and it would add another ledger. The property that matters, a medios-node process that cannot create cgroups, holds on any unprivileged host, not only RunPod. Rejected.</p>
        <h3>Reserving pods or GPUs per framework replaces offers with static allocation</h3>
        <p>Reserving each pod or GPU for one framework removes the contention, but it replaces offers to every framework with static allocation. Rejected as a product decision.</p>

        <h2>Recommendation: implement the split, then run the first gpu/assign node inside a RunPod pod</h2>
        <ol>
          <li><b>Implementation PR for #45.</b> It adds <code>GpuDevicesIsolator</code>, which reads each assignment from the allocation checkpoint, registers the two symbols, and sets <code>CUDA_VISIBLE_DEVICES</code> from <code>gpu/assign</code>. All of it is in <code>src/modules/gpu</code>; the operator sets <code>gpu_isolation</code> with <code>--attributes</code>. Tests cover the hook table above, recovery after a medios-node restart, and a launch refused when <code>gpu/devices</code> runs without <code>gpu/assign</code>.</li>
          <li><b>Value of <code>CUDA_VISIBLE_DEVICES</code>, settled in that PR before merge.</b> <code>gpu/assign</code> writes the assigned devices as <code>GPU-&lt;uuid&gt;</code> values, which CUDA accepts. PyTorch and Ray device discovery run under that form on a medios node inside a RunPod pod. If either fails, the PR writes NVML indices with <code>CUDA_DEVICE_ORDER=PCI_BUS_ID</code>. Either value is a change inside <code>prepare()</code> and leaves the design unchanged.</li>
          <li><b>Rerun the 2026-11-26 case.</b> A medios node inside a two-GPU RunPod pod with <code>--isolation=…,com_medioslab_medios_gpu_assign</code> runs one tabular-bench task and one <code>gpus:1</code> task from a second framework, neither setting <code>CUDA_VISIBLE_DEVICES</code>. Pass condition: <code>nvidia-smi</code> shows each process on a different GPU, and the offer carries <code>gpu_isolation:assign</code>.</li>
          <li><b>docker_shell stays out of scope.</b> Moving it onto the shared ledger would also fix #149, but RunPod pods have no Docker daemon, so the failure above does not depend on it. It gets its own issue.</li>
        </ol>
      </div>
