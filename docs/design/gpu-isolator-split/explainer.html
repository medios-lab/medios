<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design: separate GPU assignment from GPU device isolation (medios#45)</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root {
    --bg: #F4F6F9; --card: #FFFFFF; --line: #DDE3EC; --fg: #1F2933; --muted: #5A6577;
    --blue: #184E88; --teal: #137A63; --red: #B83333; --amber: #B45309;
    --teal-bg: #E3F2EE; --red-bg: #F8E6E6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 1.55rem; margin: 0 0 4px; color: var(--blue); }
  h2 { font-size: 1.12rem; margin: 34px 0 8px; color: var(--blue); }
  h3 { font-size: 1rem; margin: 18px 0 6px; }
  p { margin: 6px 0 12px; }
  code { font: 0.87em ui-monospace, SFMono-Regular, Menlo, monospace; background: #EEF1F5; padding: 1px 4px; border-radius: 3px; }
  pre { font: 0.84em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #EEF1F5; padding: 10px 12px;
    border-radius: 6px; overflow-x: auto; margin: 6px 0 12px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .wide { max-width: 1140px; margin: 0 auto; padding: 0 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
  .wrap { overflow-x: auto; margin: 6px 0 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; font-size: 0.87rem; }
  th { background: #EEF1F5; font-weight: 600; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 12px; }
  label.ctl { display: block; font-size: 0.84rem; color: var(--muted); }
  select, input[type=range] { width: 100%; margin-top: 4px; font: inherit; }
  select { padding: 5px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; margin-top: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0; }
  @media (max-width: 820px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .kpi { border-radius: 6px; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); }
  .kpi b { display: block; font-size: 1.3rem; }
  .kpi span { font-size: 0.8rem; color: var(--muted); }
  .kpi.bad b { color: var(--red); } .kpi.good b { color: var(--teal); } .kpi.warn b { color: var(--amber); }
  .result { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 0.87rem; background: #fff; }
  .result ul { margin: 6px 0 0 18px; padding: 0; }
  .src { color: var(--muted); font-size: 0.85rem; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// Behaviour model for appendix A: one node with two GPUs, tasks that each
// request gpus:1. Each rule cites a row of appendix B.

const NODES = {
  unpriv: "Node without cgroups/devices (RunPod pod)",
  priv: "Linux node with cgroups/devices",
};

const CONFIGS = {
  none: "Current: no GPU isolator",
  module: "Current: GPU module",
  assign: "Proposed: gpu/assign",
  both: "Proposed: gpu/assign,gpu/devices",
  devicesOnly: "Proposed, misconfigured: gpu/devices alone",
};

const DEVICE_REFUSAL = "launch refused by the containerizer: device declarations without cgroups/devices (containerizer.cpp:282-299)";
const NO_PLACEMENT = "launch refused by gpu/devices prepare(): no assignment recorded for this container (proposed)";

function mechanism(node, config) {
  const none = { label: "No component chooses a device", places: false, env: false, enforces: false, persists: false, advertised: null };
  const module = { label: "GPU module: assignment by UUID and device cgroup; no CUDA_VISIBLE_DEVICES", places: true, env: false, enforces: true, persists: true, advertised: null };
  const assign = { label: "gpu/assign: assignment by UUID and CUDA_VISIBLE_DEVICES; no device cgroup", places: true, env: true, enforces: false, persists: true, advertised: "gpu_isolation:assign" };
  const both = { label: "gpu/assign + gpu/devices: assignment, CUDA_VISIBLE_DEVICES and device cgroup", places: true, env: true, enforces: true, persists: true, advertised: "gpu_isolation:assign,devices" };
  const refused = (reason) => ({ label: "Launch refused", refused: reason, places: false, env: false, enforces: false, persists: false, advertised: null });
  if (config === "none") return none;
  if (config === "module") return node === "unpriv" ? refused(DEVICE_REFUSAL) : module;
  if (config === "assign") return assign;
  if (config === "both") return node === "unpriv" ? refused(DEVICE_REFUSAL) : both;
  return refused(NO_PLACEMENT);
}

const TASKS = [
  { framework: "framework A", ownIndex: 0 },
  { framework: "framework B", ownIndex: null },
  { framework: "framework A", ownIndex: 1 },
];

function simulate(node, config, count, restart, ownEnv) {
  const m = mechanism(node, config);
  let free = [0, 1];
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = TASKS[i];
    const r = { i, framework: t.framework, state: "running", device: null, openable: [], note: "" };
    if (i >= 2) { r.state = "not launched"; r.note = "the controller has no unallocated gpus on this node to offer"; out.push(r); continue; }
    if (m.refused) { r.state = "refused"; r.note = m.refused; out.push(r); continue; }
    if (restart && i === 1 && !m.persists) free = [0, 1];
    const own = ownEnv && t.ownIndex !== null ? t.ownIndex : null;
    if (!m.places) {
      r.device = own !== null ? own : 0;
      r.openable = [0, 1];
      r.note = own !== null ? "its command sets CUDA_VISIBLE_DEVICES=" + own : "no CUDA_VISIBLE_DEVICES, so CUDA uses device 0";
    } else {
      const placed = free.shift();
      if (own !== null && !m.enforces) {
        r.device = own;
        r.note = "assigned GPU " + placed + ", but its command's CUDA_VISIBLE_DEVICES=" + own + " overrides the isolator's value";
      } else {
        r.device = placed;
        r.note = m.env ? "assigned GPU " + placed + ", named in CUDA_VISIBLE_DEVICES" : "assigned GPU " + placed + "; the device cgroup allows only that device";
        if (own !== null && own !== placed) r.note += "; its command's CUDA_VISIBLE_DEVICES=" + own + " names a denied device, so CUDA finds none";
      }
      r.openable = m.enforces ? [r.device] : [0, 1];
    }
    out.push(r);
  }
  const holders = {};
  out.forEach(r => { if (r.state === "running") holders[r.device] = (holders[r.device] || 0) + 1; });
  out.forEach(r => { r.shared = r.state === "running" && holders[r.device] > 1; });
  return { m, tasks: out };
}

function Diagram({ sim, restart }) {
  const W = 560, H = 250, tx = 20, tw = 200, gx = 380, gw = 150;
  const ty = i => 30 + i * 70, gy = d => 55 + d * 100;
  const colour = r => r.state !== "running" ? (r.state === "refused" ? "#B83333" : "#5A6577") : r.shared ? "#B83333" : "#137A63";
  const holders = d => sim.tasks.filter(r => r.state === "running" && r.device === d).length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Tasks and the GPUs they use">
      {sim.tasks.map(r => (
        <g key={"t" + r.i}>
          <rect x={tx} y={ty(r.i)} width={tw} height="48" rx="6" fill="#fff" stroke={colour(r)}
            strokeWidth="1.5" strokeDasharray={r.state === "not launched" ? "5 4" : "0"} />
          <text x={tx + 10} y={ty(r.i) + 20} fontSize="12.5" fontWeight="600" fill="#1F2933">Task {r.i + 1} ({r.framework})</text>
          <text x={tx + 10} y={ty(r.i) + 37} fontSize="11" fill={colour(r)}>
            {r.state === "running" ? (r.shared ? "shares a GPU" : "sole user of its GPU") : r.state}
            {restart && r.i >= 1 && r.state !== "not launched" ? " (after node restart)" : ""}</text>
        </g>
      ))}
      {[0, 1].map(d => (
        <g key={"g" + d}>
          <rect x={gx} y={gy(d)} width={gw} height="50" rx="6" fill={holders(d) > 1 ? "#F8E6E6" : "#E3F2EE"}
            stroke={holders(d) > 1 ? "#B83333" : "#137A63"} strokeWidth="1.5" />
          <text x={gx + 12} y={gy(d) + 22} fontSize="12.5" fontWeight="600" fill="#1F2933">GPU {d}</text>
          <text x={gx + 12} y={gy(d) + 39} fontSize="11" fill="#5A6577">{holders(d)} task(s) using it</text>
        </g>
      ))}
      {sim.tasks.filter(r => r.state === "running").map(r => (
        <g key={"l" + r.i}>
          {r.openable.filter(d => d !== r.device).map(d => (
            <line key={d} x1={tx + tw} y1={ty(r.i) + 24} x2={gx} y2={gy(d) + 25} stroke="#B45309" strokeWidth="1.2" strokeDasharray="4 4" />
          ))}
          <line x1={tx + tw} y1={ty(r.i) + 24} x2={gx} y2={gy(r.device) + 25} stroke={r.shared ? "#B83333" : "#137A63"} strokeWidth="2.4" />
        </g>
      ))}
      <g transform={`translate(20, ${H - 14})`}>
        <line x1="0" y1="-4" x2="22" y2="-4" stroke="#137A63" strokeWidth="2.4" />
        <text x="28" y="0" fontSize="11" fill="#5A6577">device in use</text>
        <line x1="120" y1="-4" x2="142" y2="-4" stroke="#B45309" strokeWidth="1.2" strokeDasharray="4 4" />
        <text x="148" y="0" fontSize="11" fill="#5A6577">device the task can open but was not assigned</text>
      </g>
    </svg>
  );
}

function BehaviourModel() {
  const [node, setNode] = useState("unpriv");
  const [config, setConfig] = useState("none");
  const [count, setCount] = useState(2);
  const [restart, setRestart] = useState(false);
  const [ownEnv, setOwnEnv] = useState(false);
  const sim = simulate(node, config, count, restart, ownEnv);
  const running = sim.tasks.filter(r => r.state === "running");
  const shared = running.filter(r => r.shared).length;
  const exposed = running.filter(r => r.openable.length > 1).length;
  const refused = sim.tasks.filter(r => r.state === "refused").length;
  return (
    <div className="card">
      <div className="controls">
        <label className="ctl">Node
          <select value={node} onChange={e => setNode(e.target.value)}>
            {Object.entries(NODES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </label>
        <label className="ctl">GPU isolation in --isolation
          <select value={config} onChange={e => setConfig(e.target.value)}>
            {Object.entries(CONFIGS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </label>
        <label className="ctl">Tasks launched, each with gpus:1: {count}
          <input type="range" min="1" max="3" step="1" value={count} onChange={e => setCount(+e.target.value)} />
        </label>
        <div>
          <label className="check"><input type="checkbox" checked={restart} onChange={e => setRestart(e.target.checked)} />
            medios-node restarts between tasks 1 and 2; task 1 keeps running</label>
          <label className="check"><input type="checkbox" checked={ownEnv} onChange={e => setOwnEnv(e.target.checked)} />
            Framework A sets CUDA_VISIBLE_DEVICES in its commands</label>
        </div>
      </div>
      <div className="kpis">
        <div className={"kpi " + (shared ? "bad" : "good")}><b>{shared}</b><span>running tasks sharing a GPU</span></div>
        <div className={"kpi " + (exposed ? "warn" : "good")}><b>{exposed}</b><span>running tasks that can open an unassigned GPU</span></div>
        <div className={"kpi " + (refused ? "bad" : "good")}><b>{refused}</b><span>launches refused</span></div>
        <div className={"kpi " + (sim.m.advertised ? "good" : "warn")}><b>{sim.m.advertised ? "yes" : "no"}</b><span>isolation mode in the offer</span></div>
      </div>
      <div className="grid-2">
        <div><Diagram sim={sim} restart={restart} /></div>
        <div className="result">
          <b>{sim.m.label}</b>
          <ul>
            {sim.tasks.map(r => <li key={r.i}>Task {r.i + 1} ({r.framework}): {r.state === "running" ? "uses GPU " + r.device + "; " + r.note : r.note}</li>)}
          </ul>
          <p style={{marginBottom: 0}}>Offer attribute: {sim.m.advertised ? <code>{sim.m.advertised}</code> : "none"}</p>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div>
      <div className="page">
        <h1>Separate GPU assignment from GPU device isolation</h1>
        <div className="meta">Design proposal for medios#45 · Status: proposed · Component: <code>src/modules/gpu</code> · Code references are to medios-lab/medios master and are listed in appendix B</div>

        <h2>The failure</h2>
        <p>Medios tracks how many GPUs a task receives, but it leaves the choice of physical devices to the node. On the RunPod pods medios currently runs on, no node component makes that choice. We observed this on 2026-11-26 on a pod with two A100s. The node advertised <code>gpus:2</code>, the controller recorded both as allocated, and tabular-bench's tasks were running on the pod. Those tasks used separate devices only because tabular-bench wrote <code>CUDA_VISIBLE_DEVICES=0</code> and <code>CUDA_VISIBLE_DEVICES=1</code> into its own commands.</p>
        <p>That node ran the medios containerizer with no GPU isolator in <code>--isolation</code>. When a task asks for <code>gpus:1</code>, the containerizer prepares the container, and none of the listed isolators looks at the <code>gpus</code> resource. The executor then starts the command with the environment it was given, which contains no <code>CUDA_VISIBLE_DEVICES</code>. CUDA enumerates every device it can open and, by default, uses device 0. A task from another framework would therefore have run on device 0 alongside whichever tabular-bench task already held it. That outcome follows from the code path and CUDA's default behaviour; we did not run such a task.</p>

        <h2>Why the existing GPU module does not run there</h2>
        <p>Medios already has a component that chooses devices. The GPU module, <code>libmedios_gpu.so</code>, loads as an isolator through <code>--modules</code> and <code>--isolation</code>. When a container is prepared, the module assigns the container's grant (the quantity of <code>gpus</code> in its resources) to specific devices, identified by NVML UUID. It keeps those assignments in an in-memory ledger, so the next container gets a device no one holds. It also writes each assignment to a checkpoint in the container's directory, so <code>recover()</code> can rebuild the ledger when medios-node restarts while containers keep running.</p>
        <p>Every assignment the module makes also produces device declarations: the <code>/dev/nvidia*</code> files the container may open. The containerizer grants those through the cgroup devices controller. If any isolator returns declarations and <code>--isolation</code> lists neither <code>cgroups/devices</code> nor <code>cgroups/all</code>, the containerizer refuses the launch. On a RunPod pod, enabling <code>cgroups/devices</code> would require a writable cgroup hierarchy. We have assumed the pods do not provide one, because they run unprivileged (observed 2026-11-10), but we have not inspected <code>/sys/fs/cgroup</code> on a pod. If a pod does expose a writable devices hierarchy, the module could run there unchanged, and the case for this proposal would rest only on the reasons in the next two sections.</p>
        <p>The docker_shell containerizer, the other place medios assigns GPUs, needs a Docker daemon, and the pods have none (observed 2026-11-10). Its ledger also does not survive a node restart, because its <code>recover()</code> does nothing (#149).</p>

        <h2>Proposal</h2>
        <p>Assignment and device isolation are independent in the module's code. Only device isolation needs the cgroup. The proposal splits the module into two isolators in the same library, sharing one ledger.</p>
        <p><code>gpu/assign</code> keeps the assignment, the ledger, the checkpoint, recovery and release. It adds one behaviour the module lacks today: it sets <code>CUDA_VISIBLE_DEVICES</code> to the assigned devices. For a command task the variable goes into the task environment, and for any other container into the container environment, matching how the module already passes its library paths. <code>gpu/assign</code> returns no device declarations, so the containerizer accepts it on a node without <code>cgroups/devices</code>.</p>
        <p><code>gpu/devices</code> keeps everything that touches device access: the declarations, the device mounts for a container with its own root filesystem, and the driver-volume injection. Its <code>prepare()</code> reads the container's assignment from the shared ledger and fails if there is none. It depends on <code>gpu/assign</code> having prepared the container first. The containerizer creates module isolators in <code>--isolation</code> order and runs their <code>prepare()</code> calls one after another in that order, so listing <code>gpu/assign</code> first satisfies the dependency.</p>
        <p>An operator chooses between the two modes in <code>--isolation</code> alone:</p>
        <pre># node without cgroups/devices
--isolation=posix/cpu,posix/mem,gpu/assign

# node with cgroups/devices
--isolation=cgroups/all,gpu/assign,gpu/devices</pre>
        <p>The first configuration costs isolation. <code>CUDA_VISIBLE_DEVICES</code> controls which devices CUDA uses, but a task can override it in its own command, and the task environment the isolator sets loses to the command's (<code>executor.cpp:738-768</code>). A task can also open <code>/dev/nvidia*</code> directly. On such a node, medios gives each task a distinct device and tells it which one, but it relies on the task to stay there. A framework that needs enforced isolation has to be able to tell the two kinds of node apart before it launches anything. For that, the node would report its mode as an offer attribute, for example <code>gpu_isolation:assign</code> or <code>gpu_isolation:assign,devices</code>. How the node derives that attribute is open (see "What remains unverified").</p>
        <p>The module also supports shares, grants smaller than one device. It accepts a share only for a resource declared over a single device, and it records no assignment for it (<code>units.cpp:325-345</code>). The split changes none of that. Where only <code>gpu/assign</code> runs, nothing limits the memory or compute of tasks sharing a device. Our provisional default for such nodes is therefore a units file that declares whole devices.</p>

        <div className="wrap">
          <table>
            <thead><tr><th>Isolator hook</th><th>gpu/assign</th><th>gpu/devices</th></tr></thead>
            <tbody>
              <tr><td><code>prepare()</code></td><td>Assign devices, write checkpoint, return <code>CUDA_VISIBLE_DEVICES</code></td><td>Read assignment; return declarations, device mounts, driver volume; fail if no assignment</td></tr>
              <tr><td><code>recover()</code></td><td>Rebuild ledger from checkpoints</td><td>None; uses the rebuilt ledger</td></tr>
              <tr><td><code>update()</code></td><td>As today: growth beyond assigned devices refused</td><td>As today: access not revoked on shrink</td></tr>
              <tr><td><code>cleanup()</code></td><td>Release assignment, remove checkpoint</td><td>None</td></tr>
              <tr><td>Fails when</td><td>Units file missing or invalid, or NVML unavailable (as today)</td><td><code>cgroups/devices</code> absent (containerizer check), or no assignment from <code>gpu/assign</code></td></tr>
            </tbody>
          </table>
        </div>
        <p className="src">The names <code>gpu/assign</code> and <code>gpu/devices</code> stand in for the module symbols the implementation will register (the current symbol is <code>com_medioslab_medios_gpu</code>).</p>

        <h2>Alternatives</h2>
        <h3>A mode parameter on the existing module</h3>
        <p>The module could take a parameter in its <code>modules.json</code> entry, such as <code>enforce=false</code>, that skips the declarations. That gives the same runtime behaviour as the split, and it could expose an offer attribute too. The evidence does not rule it out, so the choice between the two is a judgment for the reviewer.</p>
        <p>The split is preferred for two reasons. First, the mode then lives in one place. With a parameter, whether a node enforces device access depends on both the module parameter and <code>--isolation</code>, and an operator has to keep them consistent. With the split, <code>--isolation</code> alone states it, and the containerizer's existing check already refuses <code>gpu/devices</code> without <code>cgroups/devices</code>. Second, medios-node parses <code>--isolation</code> itself (<code>containerizer.cpp:482-516</code>), so it could derive the attribute from the isolator names it loaded. A module parameter reaches only the module's <code>create()</code>, so the module would have to report the mode back to the node through an interface that does not exist yet.</p>
        <p>The split has its own costs. The ledger and the mutex that guards it (<code>gpu_isolator.cpp:89-93</code>) become state shared between two isolator objects, and <code>gpu/devices</code> gains an ordering dependency on <code>gpu/assign</code>. No module in <code>src/modules</code> registers two isolators today, so this would set the pattern.</p>
        <h3>A new in-tree assignment isolator</h3>
        <p>An isolator in <code>src/node/containerizer/medios/isolators</code> could do the assignment without touching the module. It would be a third ledger, alongside docker_shell's and the module's, and a node running both it and the module would assign every grant twice. Rejected for that reason.</p>
        <h3>A RunPod-specific containerizer</h3>
        <p>A containerizer for pods would need its own launch, sandbox, logging and recovery, which the medios containerizer already provides, and it would add another ledger. What makes a pod different is that the node lacks cgroup privilege, and that is true of other unprivileged hosts as well. Rejected because it ties core code to one provider for a property that isn't provider-specific.</p>
        <h3>Dedicating pods or GPUs to frameworks</h3>
        <p>Reserving each pod or device for one team removes the contention, but it replaces offers to every framework with static allocation. Rejected as a product decision.</p>

        <h2>What remains unverified</h2>
        <div className="wrap">
          <table>
            <thead><tr><th>Claim or question</th><th>Status</th><th>What depends on it</th><th>How it gets settled</th></tr></thead>
            <tbody>
              <tr><td>RunPod pods expose no writable devices cgroup</td><td>Assumed from unprivileged mode; not inspected</td><td>Whether pods need <code>gpu/assign</code>-only mode at all</td><td>Inspect <code>/sys/fs/cgroup</code> on the next GPU pod</td></tr>
              <tr><td><code>CUDA_VISIBLE_DEVICES</code> as <code>GPU-</code>UUIDs, or NVML indices with <code>CUDA_DEVICE_ORDER=PCI_BUS_ID</code></td><td>Open; some tools may parse the variable as integers (unverified)</td><td>The value <code>gpu/assign</code> writes</td><td>Run PyTorch, vLLM and Ray device discovery under both forms on that pod, before the implementation merges</td></tr>
              <tr><td>How the node derives the <code>gpu_isolation</code> attribute</td><td>Proposed: from the isolator names in <code>--isolation</code>; node attributes come only from <code>--attributes</code> today</td><td>What frameworks can filter on</td><td>Implementation PR</td></tr>
              <tr><td>Whether a missing or misordered <code>gpu/assign</code> can fail at node start</td><td>Fails at first GPU launch as proposed; <code>create()</code> does not see <code>--isolation</code></td><td>When an operator learns of the misconfiguration</td><td>Implementation PR</td></tr>
              <tr><td>docker_shell uses the shared ledger</td><td>Deferred</td><td>One ledger on every node type; fixes #149</td><td>Separate issue</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="wide">
        <h2>Appendix A: behaviour model</h2>
        <p>One to three tasks, each requesting <code>gpus:1</code>, on a node with two GPUs. Tasks 1 and 3 belong to framework A, task 2 to framework B. The model encodes the rules above; it is not a measurement.</p>
        <BehaviourModel />
      </div>

      <div className="page">
        <h2>Appendix B: code references</h2>
